<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>QCM J7·J14·J28</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : une colonne d'étude étroite ; le motif de la grille de réponses d'examen (cases A–E) porte l'identité */
:root{
  --bg:#edf2f0; --surface:#ffffff; --sunk:#e1e9e6; --ink:#13221f; --muted:#51625e; --line:#cbd7d3;
  --accent:#0b6a61; --accent-soft:#d2e9e5; --on-accent:#ffffff;
  --ok:#17783a; --ok-soft:#d9efdf; --bad:#ad271e; --bad-soft:#f6dbd8; --warn:#875200; --warn-soft:#f5e6cc;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --surface:#14201e; --sunk:#1b2927; --ink:#e1ebe8; --muted:#97a8a4; --line:#2b3b38;
  --accent:#57c5b7; --accent-soft:#163a35; --on-accent:#03201c;
  --ok:#6dd08f; --ok-soft:#163423; --bad:#ff8e85; --bad-soft:#3c1b19; --warn:#efb45c; --warn-soft:#382911;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514; --surface:#14201e; --sunk:#1b2927; --ink:#e1ebe8; --muted:#97a8a4; --line:#2b3b38;
  --accent:#57c5b7; --accent-soft:#163a35; --on-accent:#03201c;
  --ok:#6dd08f; --ok-soft:#163423; --bad:#ff8e85; --bad-soft:#3c1b19; --warn:#efb45c; --warn-soft:#382911;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
.vue{display:grid;gap:22px}
p{margin:0}
h1,h2,h3{text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.petit{font-size:14px}
.masthead{display:grid;gap:10px;padding-top:8px}
.masthead h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,9vw,56px);line-height:1;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.jbox{font-family:var(--f-mono);font-size:.36em;font-weight:600;border:2px solid var(--accent);color:var(--accent);padding:5px 8px;border-radius:4px;line-height:1}
.lede{max-width:58ch;color:var(--muted)}
.h-page{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,36px);line-height:1.1;margin:4px 0 0}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.2;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.compte{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:500}
.sec{display:grid}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font-weight:700;border-radius:8px;padding:11px 18px;min-height:46px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primaire{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primaire:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lien{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.lien.danger{color:var(--bad)}
.retour{justify-self:start;text-decoration:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ajout-cta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.note{background:var(--sunk);padding:12px 14px;border-radius:8px;display:grid;gap:10px}
.alerte{background:var(--bad-soft);color:var(--bad);padding:12px 14px;border-radius:8px;font-weight:700}
.liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ligne{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.ligne:hover{border-color:var(--accent)}
.ligne-main{display:grid;gap:3px;min-width:0}
.ligne-titre{font-weight:700;overflow-wrap:anywhere}
.ligne-meta{font-size:14px;color:var(--muted)}
.ligne-side{display:grid;justify-items:end;gap:6px;flex-shrink:0}
.jalons{display:flex;gap:4px;flex-wrap:wrap}
.jal{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 5px;border:1.5px solid var(--line);border-radius:3px;color:var(--muted);line-height:1.3}
.jal.fait{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.jal.du{border-color:var(--accent);color:var(--accent);font-weight:600}
.jal.manque{text-decoration:line-through;opacity:.6}
.jalons.grand .jal{font-size:13px;padding:4px 8px}
.jal small{font-size:inherit;font-weight:500}
.score{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.score small{color:var(--muted);font-weight:500}
.score.vide{font-size:12px;color:var(--muted);font-weight:500}
.pied{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:18px;font-size:14px;color:var(--muted)}
.pied .lien{justify-self:start}
/* cours */
.cours-tete{display:grid;gap:8px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;justify-self:start;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 16px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.serie{display:grid;gap:12px}
.departs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.depart{display:grid;gap:2px;text-align:left;justify-items:start}
.depart small{font-weight:400;color:var(--muted);font-size:13px}
.depart.primaire small{color:var(--on-accent);opacity:.85}
.notions{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.notions summary{cursor:pointer;font-weight:700}
.notions ul{margin:10px 0 0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
.zone-suppr{justify-self:start}
/* quiz */
.q-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.q-top .lien{font-family:var(--f-body);font-size:15px}
.q-count{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:-12px}
.progress i{display:block;height:100%;background:var(--accent)}
.q-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pips{display:inline-flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent)}
.pips i.on{background:var(--accent)}
.tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;padding:3px 8px;border-radius:4px;background:var(--sunk);color:var(--ink)}
.tag.qru{background:var(--accent-soft)}
.enonce{font-family:var(--f-body);font-size:20px;line-height:1.4;font-weight:700;margin:0;max-width:65ch}
.enonce.petit{font-size:17px}
.props{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.prop{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.prop-btn{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;width:100%;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer;line-height:1.45}
.prop-btn[aria-disabled="true"],.prop-btn.statique{cursor:default}
.prop-txt{padding-top:4px;font-size:17px;overflow-wrap:anywhere}
.box{width:32px;height:32px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:4px;font-family:var(--f-mono);font-weight:600;font-size:15px}
.props.qru .box{border-radius:50%}
.prop:hover:not(.juste,.oubliee,.atort,.neutre){border-color:var(--accent)}
.prop.sel{border-color:var(--accent)}
.prop.sel .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prop.juste{border-color:var(--ok);background:var(--ok-soft)}
.prop.juste .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.prop.oubliee{border-color:var(--warn);background:var(--warn-soft)}
.prop.oubliee .box{background:transparent;border-color:var(--warn);color:var(--warn);border-style:dashed}
.prop.atort{border-color:var(--bad);background:var(--bad-soft)}
.prop.atort .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.prop.neutre .box{background:transparent;border-color:var(--line);color:var(--muted)}
.expl{padding:0 14px 13px 60px;font-size:15px;line-height:1.5}
.verdict{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-right:8px}
.verdict.v{color:var(--ok)}
.verdict.f{color:var(--bad)}
.etat-txt{font-weight:700}
.etat-txt.oubliee{color:var(--warn)}
.etat-txt.atort{color:var(--bad)}
.resultat{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:12px 16px;border-radius:var(--r);font-family:var(--f-mono);font-size:15px;background:var(--sunk)}
.resultat strong{font-family:var(--f-body);font-size:17px}
.resultat.r0{background:var(--ok-soft);color:var(--ok)}
.resultat.r1{background:var(--warn-soft);color:var(--warn)}
.resultat.r2,.resultat.r3{background:var(--bad-soft);color:var(--bad)}
.retenir{background:var(--surface);border:1px dashed var(--accent);border-radius:var(--r);padding:12px 16px;display:grid;gap:4px}
.retenir .eyebrow{color:var(--accent)}
.barre-action{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);margin-top:-6px}
.astuce{font-size:13px;color:var(--muted)}
@media (hover:none){.astuce{display:none}}
/* bilan */
.bilan{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.bigscore{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,12vw,68px);line-height:1;font-variant-numeric:tabular-nums}
.bigscore .sur{font-size:.45em;color:var(--muted);font-weight:600}
.sur20{font-family:var(--f-mono);font-size:17px;font-weight:600}
.dist{display:flex;flex-wrap:wrap;gap:6px}
.dist span{font-family:var(--f-mono);font-size:13px;padding:4px 9px;border-radius:4px;background:var(--sunk)}
.dist .d0{background:var(--ok-soft);color:var(--ok)}
.dist .d1{background:var(--warn-soft);color:var(--warn)}
.dist .d2,.dist .d3{background:var(--bad-soft);color:var(--bad)}
.corrections{display:grid;gap:16px}
.carte-corr{display:grid;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.bascule{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.bascule input{width:18px;height:18px;accent-color:var(--accent)}
/* ajout + génération */
.form{display:grid;gap:18px}
.champ{display:grid;gap:6px;min-width:0}
.champ label{font-weight:700}
.aide{font-size:14px;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
input[type=text],select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:150px}
input[type=file]{font:inherit;max-width:100%}
.fichiers{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.fichiers li{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.fichiers li span{overflow-wrap:anywhere;min-width:0}
.fichiers small{color:var(--muted)}
.etapes{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.etape{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:center}
.puce{width:14px;height:14px;border-radius:3px;border:2px solid var(--line)}
.etape.en_cours .puce{border-color:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.etape.ok .puce{background:var(--ok);border-color:var(--ok)}
.etape.echec .puce{background:var(--bad);border-color:var(--bad)}
.etape.attente{color:var(--muted)}
.etape-detail{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
@keyframes pulse{50%{background:var(--accent)}}
@media (prefers-reduced-motion:reduce){.etape.en_cours .puce{animation:none;background:var(--accent-soft)}}
@media (max-width:520px){
  .ligne{flex-wrap:wrap}
  .ligne-side{justify-items:start;grid-auto-flow:column;align-items:center;gap:12px}
  .duo{grid-template-columns:1fr}
  .expl{padding-left:14px}
  .enonce{font-size:18px}
  .prop-txt{font-size:16px}
}
.carte-connexion{max-width:420px}
</style>
</head>

<script>
(function(){
"use strict";

const MATIERES = ["Appareil urinaire","Appareil respiratoire","Immunopathologie","Biostatistique","Génétique médicale","PIX (socle numérique)","Autre"];
const NIVEAUX = {1:"Facile",2:"Moyen",3:"Difficile"};
const NIVEAUX_PL = {1:"faciles",2:"moyennes",3:"difficiles"};
const PORTEES = {tout:"Tout le cours","1":"Facile","2":"Moyen","3":"Difficile",erreurs:"Mes erreurs"};
const JALONS = [7,14,28];
const LETTRES = "ABCDE";
const MAX_TEXTE = 230000;
const IMAGES_PAR_APPEL = 5;
const FATAL = new Set(["cle_api","credit","limite_jour","refused","cancelled","auth","droits","config","source_absente","prompt_too_large"]);
const CDN = {
  pdf:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfWorker:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  zip:"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
};

// ---------- Démo (questions d'exemple, pas tirées d'un cours) ----------
const DEMO = {
  id:"demo", demo:true, titre:"Démo · Physiologie rénale", matiere:"Démo", creeLe:new Date().toISOString(), statut:"pret",
  notions:["Néphron et organisation du rein","Débit de filtration glomérulaire","Réabsorption tubulaire","Hormone antidiurétique","Clairance de la créatinine","Système rénine-angiotensine-aldostérone"],
  questions:[
    {id:"d1",niveau:1,type:"QRU",enonce:"Concernant l'organisation du rein, quelle est la proposition exacte ?",a_retenir:"Néphron = unité fonctionnelle (environ 1 million par rein) ; glomérules dans le cortex ; le tube collecteur n'appartient pas au néphron au sens strict.",propositions:[
      {id:"a",vrai:true,texte:"Le néphron est l'unité structurale et fonctionnelle du rein.",explication:"Chaque rein en compte environ un million."},
      {id:"b",vrai:false,texte:"Chaque rein contient environ 10 000 néphrons.",explication:"Chiffre modifié : chaque rein contient environ 1 million de néphrons."},
      {id:"c",vrai:false,texte:"Les glomérules sont situés dans la médullaire rénale.",explication:"Les glomérules sont dans le cortex ; la médullaire contient les anses de Henlé et les tubes collecteurs."},
      {id:"d",vrai:false,texte:"L'anse de Henlé est entièrement située dans le cortex.",explication:"L'anse de Henlé descend dans la médullaire, plus ou moins profondément selon le type de néphron (cortical ou juxtamédullaire)."},
      {id:"e",vrai:false,texte:"Le tube collecteur fait partie du néphron au sens strict.",explication:"Le tube collecteur n'appartient pas au néphron au sens strict : son origine embryologique est différente (bourgeon urétéral)."}]},
    {id:"d2",niveau:1,type:"QCM",enonce:"Concernant le débit de filtration glomérulaire (DFG), quelles sont les propositions exactes ?",a_retenir:"DFG ≈ 120 mL/min/1,73 m², soit environ 180 L/jour ; référence = clairance de l'inuline ; la créatinine plasmatique augmente quand le DFG baisse.",propositions:[
      {id:"a",vrai:true,texte:"Chez l'adulte jeune, le DFG est d'environ 120 mL/min/1,73 m².",explication:"C'est la valeur normale de référence ; elle diminue avec l'âge."},
      {id:"b",vrai:true,texte:"La créatinine plasmatique augmente quand le DFG diminue.",explication:"La créatinine est éliminée par filtration : si le DFG baisse, elle s'accumule dans le plasma."},
      {id:"c",vrai:true,texte:"La clairance de l'inuline est la méthode de référence pour mesurer le DFG.",explication:"L'inuline est librement filtrée, ni réabsorbée ni sécrétée : sa clairance est égale au DFG."},
      {id:"d",vrai:false,texte:"Le volume filtré par les glomérules est d'environ 180 mL par jour.",explication:"Unité modifiée : c'est environ 180 L par jour (120 mL/min × 1 440 min)."},
      {id:"e",vrai:false,texte:"La créatinine est massivement réabsorbée par le tubule proximal.",explication:"La créatinine n'est pas réabsorbée : elle est filtrée et un peu sécrétée par le tubule."}]},
    {id:"d3",niveau:2,type:"QCM",enonce:"Concernant la réabsorption tubulaire, quelles sont les propositions exactes ?",a_retenir:"Tube proximal : environ 2/3 du sodium et quasi tout le glucose ; branche ascendante large : NaCl sans eau (NKCC2, cible du furosémide) ; aldostérone : néphron distal.",propositions:[
      {id:"a",vrai:true,texte:"Le tube contourné proximal réabsorbe environ les deux tiers du sodium filtré.",explication:"Environ 65 % du sodium et de l'eau filtrés sont réabsorbés dans le tube proximal."},
      {id:"b",vrai:true,texte:"Le glucose filtré est réabsorbé essentiellement dans le tube contourné proximal.",explication:"Par les cotransporteurs SGLT ; au-delà du seuil rénal (glycémie d'environ 10 mmol/L), une glycosurie apparaît."},
      {id:"c",vrai:true,texte:"La branche ascendante large de l'anse de Henlé est imperméable à l'eau.",explication:"Elle réabsorbe du NaCl sans eau : c'est le segment de dilution."},
      {id:"d",vrai:true,texte:"Le cotransporteur Na⁺-K⁺-2Cl⁻ (NKCC2) de la branche ascendante large est la cible des diurétiques de l'anse.",explication:"Le furosémide inhibe NKCC2."},
      {id:"e",vrai:false,texte:"L'aldostérone agit principalement sur le tube contourné proximal.",explication:"Inversion de segment : l'aldostérone agit sur le néphron distal (tube contourné distal terminal et tube collecteur)."}]},
    {id:"d4",niveau:2,type:"QRU",enonce:"Concernant l'hormone antidiurétique (ADH), quelle est la proposition exacte ?",a_retenir:"ADH : synthèse hypothalamique, libération posthypophysaire ; stimulée par une hausse de l'osmolalité ; récepteurs V2, puis aquaporines 2 : urines concentrées.",propositions:[
      {id:"a",vrai:true,texte:"Elle augmente la réabsorption d'eau dans le tube collecteur en faisant insérer des aquaporines 2 dans la membrane apicale.",explication:"C'est son mécanisme d'action principal, via les récepteurs V2."},
      {id:"b",vrai:false,texte:"Elle est sécrétée par l'antéhypophyse.",explication:"Elle est synthétisée par l'hypothalamus (noyaux supraoptiques et paraventriculaires) et libérée par la posthypophyse."},

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k.slice(0,2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : String(v));

  const add = (k) => { if (k == null || k === false) return; if (Array.isArray(k)) return k.forEach(add); el.append(k instanceof Node ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}

async function api(action, corps, extra){
  const opts = corps === undefined ? {credentials:"same-origin"} : {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corps)};
  let r;
  try { r = await fetch("api.php?a=" + action + (extra || ""), opts); } catch { throw {code:"reseau"}; }
  let d = null; try { d = await r.json(); } catch {}
  if (r.status === 401 && action !== "connexion"){ S.vue = "connexion"; render(); throw {code:"auth"}; }
  if (!r.ok || !d) throw {code:(d && d.erreur) || "reseau", message:d && d.message};
  return d;
}
// Appel long (Claude) : le serveur renvoie une ligne JSON par étape, la dernière contient "fin".
async function apiFlux(action, corps, surProgres, signal){
  let r;
  try { r = await fetch("api.php?a=" + action, {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corps), signal}); }
  catch (e){ throw {code: signal && signal.aborted ? "cancelled" : "reseau"}; }
  if (r.status === 401){ S.vue = "connexion"; render(); throw {code:"auth"}; }
  if (!r.ok){ let d = null; try { d = await r.json(); } catch {} throw {code:(d && d.erreur) || "reseau", message:d && d.message}; }
  let fin = null, tampon = "";
  const traiter = (ligne) => {
    ligne = ligne.trim(); if (!ligne) return;
    let m; try { m = JSON.parse(ligne); } catch { return; }
    if (m.erreur) throw {code:m.erreur, message:m.message};
    if (m.progres !== undefined && surProgres) surProgres(m.progres);
    if (m.fin) fin = m.fin;
  };
  try {
    if (r.body && r.body.getReader){
      const lecteur = r.body.getReader(), dec = new TextDecoder();
      for (;;){
        const {value, done} = await lecteur.read();
        if (done) break;
        tampon += dec.decode(value, {stream:true});
        let i; while ((i = tampon.indexOf("\n")) >= 0){ traiter(tampon.slice(0, i)); tampon = tampon.slice(i + 1); }
      }
    } else tampon = await r.text();
    tampon.split("\n").forEach(traiter);
  } catch (e){
    if (e && e.code) throw e;
    throw {code: signal && signal.aborted ? "cancelled" : "coupure"};
  }
  if (!fin) throw {code:"coupure"};
  return fin;
}

function demarrerQuiz(c, qs, portee){
  const dern = (S.progres[c.id] || {}).dernier || {};
  const pool = portee === "tout" ? qs : portee === "erreurs" ? qs.filter(q => q.id in dern && dern[q.id] < 1) : qs.filter(q => q.niveau === Number(portee));
  if (!pool.length) return;
  const ordre = [1,2,3].flatMap(n => shuffle(pool.filter(q => q.niveau === n)));
  S.quiz = {coursId:c.id, titre:c.titre, mode:S.mode, portee, i:0, enregistre:false,
    items:ordre.map(q => ({q, ordre:shuffle(q.propositions.map(p => p.id)), choix:[], valide:false, fautes:0, points:0}))};
  aller("quiz", {toutVoir:false, sauvegarde:null});
}
function basculer(pid){
  const it = S.quiz.items[S.quiz.i];
  if (it.valide) return;
  if (it.q.type === "QRU") it.choix = it.choix[0] === pid ? [] : [pid];
  else it.choix = it.choix.includes(pid) ? it.choix.filter(x => x !== pid) : it.choix.concat(pid);
  render();
}
function valider(){
  const Q = S.quiz, it = Q.items[Q.i];
  if (it.valide || !it.choix.length) return;
  it.fautes = fautes(it.q, it.choix); it.points = points(it.fautes); it.valide = true;
  if (Q.mode === "examen") return suivante();
  render();
}
function suivante(){
  const Q = S.quiz;
  if (Q.i < Q.items.length - 1){ Q.i++; render(); window.scrollTo(0, 0); }
  else terminer();
}
function terminer(){
  const Q = S.quiz;
  if (!Q.items.some(x => x.valide)) return ouvrirCours(Q.coursId);
  aller("fin");
  enregistrer(Q);
}
function actionPrincipale(){ const it = S.quiz.items[S.quiz.i]; if (!it.valide) valider(); else suivante(); }
async function enregistrer(Q){
  const rep = Q.items.filter(x => x.valide);
  if (!rep.length || Q.enregistre) return;
  Q.enregistre = true;
  const ancien = S.progres[Q.coursId] || {};
  const p = {tentatives:(ancien.tentatives || []).slice(-199), dernier:Object.assign({}, ancien.dernier || {})};
  const par = {};
  for (const x of rep){ const n = String(x.q.niveau); par[n] = par[n] || {p:0, m:0}; par[n].p = round2(par[n].p + x.points); par[n].m++; p.dernier[x.q.id] = x.points; }
  p.tentatives.push({date:new Date().toISOString(), mode:Q.mode, portee:Q.portee, points:round2(rep.reduce((s, x) => s + x.points, 0)), max:rep.length, parNiveau:par});
  S.progres = Object.assign({}, S.progres, {[Q.coursId]:p});
  try { await api("progres", {id:Q.coursId, progres:p}); S.sauvegarde = "ok"; }
  catch { S.sauvegarde = "echec"; }
  if (S.vue === "fin") render();
}

document.addEventListener("keydown", e => {
  if (S.vue !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target, tag = t && t.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const it = S.quiz.items[S.quiz.i];

function chargerScript(src){
  return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error("script")); document.head.append(s); });
}
let _pdf = null, _zip = null;
function pdfjs(){
  return _pdf || (_pdf = (async () => { await chargerScript(CDN.pdf); await chargerScript(CDN.pdfWorker); if (!window.pdfjsLib) throw new Error("pdfjs"); return window.pdfjsLib; })().catch(e => { _pdf = null; throw e; }));
}
function jszip(){
  return _zip || (_zip = chargerScript(CDN.zip).then(() => { if (!window.JSZip) throw new Error("jszip"); return window.JSZip; }).catch(e => { _zip = null; throw e; }));
}
async function lirePdf(f){
  const lib = await pdfjs();
  const doc = await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()), isEvalSupported:false}).promise;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++){
    const tc = await (await doc.getPage(i)).getTextContent();
    let s = "";
    for (const it of tc.items){ if (typeof it.str !== "string") continue; s += it.str + (it.hasEOL ? "\n" : ""); }
    pages.push(s.replace(/[ \t]+/g, " ").replace(/ *\n */g, "\n").trim());
  }
  const moy = pages.reduce((s, t) => s + t.length, 0) / Math.max(1, pages.length);
  return {doc, scanne:moy < 80, texte:pages.map((t, i) => t ? "[Page " + (i + 1) + "]\n" + t : "").filter(Boolean).join("\n\n")};
}
async function pageEnImage(doc, n){
  const pg = await doc.getPage(n);
  const v1 = pg.getViewport({scale:1});
  const v = pg.getViewport({scale:Math.min(2.5, 1600 / Math.max(v1.width, v1.height))});
  const cv = document.createElement("canvas"); cv.width = Math.ceil(v.width); cv.height = Math.ceil(v.height);
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  await pg.render({canvasContext:ctx, viewport:v}).promise;
  return new Promise(ok => cv.toBlob(ok, "image/jpeg", 0.85));
}
// Les photos de téléphone sont réduites à 1600 px avant l'envoi : plus rapide, et largement lisible pour Claude.
async function reduireImage(f){
  let bmp;
  try { bmp = await createImageBitmap(f); } catch { throw {code:"image_illisible", fichier:f.name}; }
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
  return new Promise(ok => cv.toBlob(ok, "image/jpeg", 0.85));
}
const enBase64 = (blob) => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = ko; r.readAsDataURL(blob); });
function paragraphes(xml, para, run){
  const d = new DOMParser().parseFromString(xml, "application/xml"), out = [];
  for (const p of d.getElementsByTagName(para)){ let s = ""; for (const t of p.getElementsByTagName(run)) s += t.textContent; if (s.trim()) out.push(s.trim()); }
  return out;
}
async function lireDocx(f){
  const zip = await (await jszip()).loadAsync(await f.arrayBuffer());
  const x = zip.file("word/document.xml");
  return x ? paragraphes(await x.async("string"), "w:p", "w:t").join("\n") : "";
}
async function lirePptx(f){
  const zip = await (await jszip()).loadAsync(await f.arrayBuffer());
  const num = (n) => Number((n.match(/(\d+)\.xml$/) || [])[1] || 0);
  const slides = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
  const out = [];
  for (const n of slides){
    let bloc = "[Diapositive " + num(n) + "]\n" + paragraphes(await zip.file(n).async("string"), "a:p", "a:t").join("\n");
    const notes = zip.file("ppt/notesSlides/notesSlide" + num(n) + ".xml");
    if (notes){ const t = paragraphes(await notes.async("string"), "a:p", "a:t").filter(s => !/^\d+$/.test(s)); if (t.length) bloc += "\nNotes : " + t.join("\n"); }
    out.push(bloc);
  }
  return out.join("\n\n");
}
async function pool(items, k, fn){
  let idx = 0;
  await Promise.all(Array.from({length:Math.min(k, items.length)}, async () => { while (idx < items.length){ const it = items[idx++]; await fn(it); } }));
}

async function lancerGeneration(){
  const a = S.ajout, ctl = new AbortController(), sig = ctl.signal;
  S.gen = {etapes:[], ctl, titre:a.titre.trim() || "Nouveau cours", fini:false, erreur:null, coursId:null, total:0, complet:false};
  aller("generation");
  try {
    const textes = [], images = [];
    etape("lecture", "Lecture du cours", "en_cours");
    for (const f of a.fichiers){
      if (sig.aborted) throw {code:"cancelled"};
      etape("lecture", null, null, f.name);
      const ext = (f.name.split(".").pop() || "").toLowerCase();
      if (ext === "pdf"){
        const r = await lirePdf(f);
        if (r.scanne){
          const n = Math.min(r.doc.numPages, 80);
          for (let i = 1; i <= n; i++){ etape("lecture", null, null, "page " + i + "/" + n); images.push(await pageEnImage(r.doc, i)); }
        } else textes.push(r.texte);
      }
      else if (ext === "docx") textes.push(await lireDocx(f));
      else if (ext === "pptx") textes.push(await lirePptx(f));
      else if (ext === "txt" || ext === "md") textes.push(await f.text());
      else if ((f.type || "").indexOf("image/") === 0) images.push(await reduireImage(f));
      else throw {code:"format", fichier:f.name};
    }
    if (a.texte.trim()) textes.push(a.texte.trim());
    etape("lecture", null, "ok", a.fichiers.length ? a.fichiers.length + " " + pluriel(a.fichiers.length, "fichier", "fichiers") : "texte collé");
    if (images.length){
      const n = Math.ceil(images.length / IMAGES_PAR_APPEL);
      etape("transcription", "Lecture des images (" + images.length + ")", "en_cours");
      for (let i = 0; i < n; i++){
        etape("transcription", null, null, "lot " + (i + 1) + "/" + n);
        const lot = await Promise.all(images.slice(i * IMAGES_PAR_APPEL, (i + 1) * IMAGES_PAR_APPEL).map(async b => ({type:"image/jpeg", data:await enBase64(b)})));
        textes.push((await apiFlux("transcrire", {images:lot}, null, sig)).texte);
      }
      etape("transcription", null, "ok", "");
    }
    const texte = textes.filter(Boolean).join("\n\n").replace(/\n{3,}/g, "\n\n").trim();
    if (texte.length < 300) throw {code:"trop_court"};
    if (bytes(texte) > MAX_TEXTE) throw {code:"prompt_too_large"};
    const {id} = await api("cours_creer", {texte, titre:a.titre.trim(), matiere:a.matiere});
    S.gen.coursId = id;
    S.ajout = nouvelAjout();
    await planEtLots(id, null, sig);
  } catch (e){
    S.gen.erreur = messageErreur(e);
    for (const x of S.gen.etapes) if (x.etat === "en_cours") x.etat = "echec";
  }
  await finGeneration();
}
async function completer(c){
  const ctl = new AbortController();
  S.gen = {etapes:[], ctl, titre:c.titre || "Cours", fini:false, erreur:null, coursId:c.id, total:c.nbQuestions || 0, complet:false};
  aller("generation");
  try { await planEtLots(c.id, c.lots && c.lots.length ? c : null, ctl.signal); }
  catch (e){
    S.gen.erreur = messageErreur(e);
    for (const x of S.gen.etapes) if (x.etat === "en_cours") x.etat = "echec";
  }
  await finGeneration();
}
async function finGeneration(){
  S.gen.fini = true;
  if (S.gen.coursId) delete S.questionsCache[S.gen.coursId];
  try { await chargerEtat(); } catch {}
  if (S.vue === "generation") render();
}
// Le plan (liste des notions et des questions à poser) puis les lots de questions, 2 à la fois.
async function planEtLots(id, cours, sig){
  if (!cours){
    etape("plan", "Repérage des notions", "en_cours", "analyse…");
    cours = (await apiFlux("plan", {id}, null, sig)).cours;
    S.gen.titre = cours.titre;
    etape("plan", null, "ok", cours.notions.length + " notions · " + cours.lots.reduce((s, l) => s + l.items.length, 0) + " questions prévues");
  }
  const lots = cours.lots;
  const todo = lots.map((_, i) => i).filter(i => lots[i].statut !== "ok");
  const parNiv = {}, rang = {};
  todo.forEach(i => { const n = lots[i].niveau; parNiv[n] = (parNiv[n] || 0) + 1; });
  todo.forEach(i => {
    const n = lots[i].niveau; rang[n] = (rang[n] || 0) + 1;
    etape("lot" + i, "Questions " + NIVEAUX_PL[n] + (parNiv[n] > 1 ? " (" + rang[n] + "/" + parNiv[n] + ")" : ""), "attente", lots[i].items.length + " questions");
  });
  let stop = null, total = cours.nbQuestions || 0, echecs = 0;
  await pool(todo, 2, async i => {
    if (stop || sig.aborted) return;
    const nbItems = lots[i].items.length;
    etape("lot" + i, null, "en_cours", "rédaction…");
    try {
      const fin = await apiFlux("lot", {id, index:i}, k => etape("lot" + i, null, null, "question " + k + "/" + nbItems), sig);
      total = fin.cours.nbQuestions;
      etape("lot" + i, null, "ok", fin.ajoutees + " " + pluriel(fin.ajoutees, "question", "questions"));
    } catch (e){
      echecs++;
      const arrete = sig.aborted || (e && e.code === "cancelled");
      etape("lot" + i, null, "echec", arrete ? "arrêté" : "échec");
      if (arrete) stop = stop || {code:"cancelled"};
      else if (e && FATAL.has(e.code)) stop = stop || e;
      else S.gen.dernierProbleme = e;
    }
  });
  S.gen.total = total; S.gen.complet = !echecs && !stop;
  if (stop) throw stop;
  if (echecs && S.gen.dernierProbleme && !total) throw S.gen.dernierProbleme;
}

demarrer();
})();
